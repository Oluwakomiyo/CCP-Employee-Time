# Full stack: postgres, api, stale-session worker, web.
# Usage: docker compose up -d --build   (db only, for local dev: docker compose up -d db)
#
# Required secrets (see server/.env.example for how to generate them):
#   JWT_SECRET, JWT_REFRESH_SECRET. The api and worker refuse to boot without them.
# Dev convenience DB password stays ccp unless POSTGRES_PASSWORD is set.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ccp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ccp}
      POSTGRES_DB: ccp_time
    ports:
      - "5432:5432"
    volumes:
      - ccp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccp -d ccp_time"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./server
    environment:
      NODE_ENV: production
      PORT: 5000
      COMPANY_TZ: Africa/Lagos
      DATABASE_URL: postgresql://ccp:${POSTGRES_PASSWORD:-ccp}@db:5432/ccp_time?schema=public
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # The worker service runs the missing clock-out job; don't run it twice.
      RUN_STALE_WORKER: "false"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "dist/server.js"]

  worker:
    build: ./server
    environment:
      NODE_ENV: production
      COMPANY_TZ: Africa/Lagos
      DATABASE_URL: postgresql://ccp:${POSTGRES_PASSWORD:-ccp}@db:5432/ccp_time?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "dist/worker.js"]

  web:
    build: ./web
    environment:
      API_ORIGIN: http://api:5000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  ccp_pgdata:
